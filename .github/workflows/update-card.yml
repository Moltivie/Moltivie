name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *" # daily, keeps the uptime line and the stats current
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.toml, ascii.txt, build.py]

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ACCESS_TOKEN is a personal token that can read private repositories.
      # Without it the stats keep their last committed values (cache/stats.json)
      # instead of silently dropping to public-only numbers.
      - name: Render
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -n "$ACCESS_TOKEN" ]; then
            python3 build.py
          else
            python3 build.py --no-fetch
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
